<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:," />
  <title>Paquiliztli — Tapestry Crochet Artist, Nahuatl Teacher, Pharmacist</title>
  <style>
    /* Teki "Midnight" theme — matched to PAQUILIZTLI CHANTEKITL's default palette */
    :root {
      color-scheme: dark;
      --bg: #050505;
      --bg-alt: #020617;
      --card-bg: #000000;
      --item-bg: #0b1220;
      --chip-bg: #1f2937;
      --border: #374151;
      --input-border: #4b5563;
      --accent: #14b8a6;
      --text-main: #ffffff;
      --text-muted: #d1d5db;
      --focus: #eab308;
      /* Teki column / title status colors */
      --todo: #15b1a4;
      --progress: #facc15;
      --done: #ec4899;
      --radius: 10px;
      --shadow-soft: 0 4px 14px rgba(0, 0, 0, .6);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background:
        linear-gradient(90deg, transparent 49.5%, rgba(55, 65, 81, .22) 50%, transparent 50.5%) 0 0 / 34px 34px,
        linear-gradient(0deg, transparent 49.5%, rgba(55, 65, 81, .22) 50%, transparent 50.5%) 0 0 / 34px 34px,
        linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
      color: var(--text-main);
      font-family: system-ui, sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100%, 760px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(36px, 8vw, 76px) clamp(20px, 5vw, 42px) calc(38px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .serpent-banner {
      position: relative;
      height: 132px;
      margin-bottom: 34px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 520px 90px at 50% 115%, rgba(20, 184, 166, .16), transparent 70%),
        var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
    }

    .serpent-banner svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
      align-items: end;
      padding-bottom: 5px;
    }

    h1 {
      margin: 0;
      max-width: 570px;
      font-family: system-ui, sans-serif;
      font-size: clamp(42px, 10vw, 72px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: .01em;
      text-wrap: balance;
    }

    .role {
      margin: 16px 0 0;
      color: var(--text-muted);
      font-size: clamp(16px, 3.5vw, 19px);
      line-height: 1.55;
    }

    .links {
      margin-top: 24px;
      display: grid;
      gap: 12px;
    }

    .link {
      position: relative;
      min-height: 96px;
      padding: 19px 68px 19px 20px;
      display: flex;
      align-items: center;
      gap: 17px;
      color: var(--text-main);
      background: var(--item-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      box-shadow: var(--shadow-soft);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: var(--shadow-soft), 0 0 14px rgba(20, 184, 166, .22);
    }

    .link:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .link:active {
      transform: translateY(1px);
    }

    /* Number chips styled like Teki's column-title pills */
    .link-number {
      flex: none;
      padding: 5px 11px;
      border-radius: 999px;
      color: #000000;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
      line-height: 1.25;
    }

    .link:nth-child(1) .link-number { background: var(--todo); }
    .link:nth-child(2) .link-number { background: var(--progress); }
    .link:nth-child(3) .link-number { background: var(--done); }

    .link-copy { min-width: 0; }

    .link-title {
      display: block;
      font-size: clamp(17px, 4vw, 21px);
      font-weight: 600;
      line-height: 1.2;
    }

    .link-note {
      display: block;
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .arrow {
      position: absolute;
      right: 21px;
      top: 50%;
      width: 31px;
      height: 31px;
      transform: translateY(-50%);
      color: var(--accent);
    }

    footer {
      margin-top: 31px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 12px;
      letter-spacing: .02em;
    }

    footer::before {
      content: "";
      width: 34px;
      height: 6px;
      background: repeating-linear-gradient(90deg, var(--accent) 0 5px, transparent 5px 8px);
    }

    @media (max-width: 520px) {
      .page { justify-content: flex-start; }
      .serpent-banner { height: 104px; margin-bottom: 28px; }
      .intro { grid-template-columns: 1fr; gap: 18px; align-items: start; }
      .link { min-height: 90px; padding-left: 17px; gap: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
</head>
